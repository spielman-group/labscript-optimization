# Configuration for a labscript-optimization session.
#
# Every key must be one this package knows, and a spelling it does not stops
# the load with a message naming it, rather than being accepted and ignored: a
# setting nothing reads is one a lab believes is in force when it is not.
#
# [GENERAL] carries the session's own settings; a learner's knobs go in
# [LEARNER.<name>], the table of the learner that takes them, and a knob
# written in [GENERAL] is refused with the table it belongs in named. A table
# written for a learner this file does not build goes unread, so the settings
# for several learners can sit here and be switched between.

[ANALYSIS]
# Which (routine, result) column of the lyse dataframe holds the cost. The
# routine that writes it is one of your own; this package never computes a
# cost. An optional "u_<result>" column alongside it is read as the
# uncertainty and weights the Gaussian process fit. A shot whose cost is NaN
# is recorded as a bad observation: it counts as a completed run and is left
# out of the fits, rather than being waited on for a cost that has already
# been and gone.
cost_key = ["zTOF_singleShot", "Nb"]

# The cost column holds something to be made as large as possible.
maximize = true

# Only parameter groups named here take part. A group written below and not
# named here is switched off; a name here that no table below defines is
# refused, since it can only be a misspelling.
groups = ["CMOT"]

[GENERAL]
# random, directed_random, differential_evolution or gaussian_process.
# gaussian_process runs an explorer beside itself; its table below says which.
learner = "gaussian_process"

# How many shots to keep in runmanager's queue at once, which defaults to 2.
# BLACS asks for a shot as soon as it finishes the last, which is before this
# optimiser has seen the cost and proposed a replacement, so a queue holding
# only one of our shots is empty at exactly that moment and runmanager gives
# BLACS a default shot instead. At one buffered run roughly every second shot
# is a default one. Raise it if the "starved" count the routine returns keeps
# climbing: the fit is taking longer than a shot.
#
# For gaussian_process it is how many explorer shots are queued behind each
# batch, if that is more than explore_runs, so raising it to cover a slow fit
# also raises the share of explorer shots; zero is allowed there, and queues
# explore_runs alone. random and directed_random keep exactly this many in
# flight, so they refuse zero. Not accepted at all with
# differential_evolution, which proposes one whole population at a time and
# waits for all of it: its queue depth is population_size.
num_buffered_runs = 2

# Stop conditions. Omit either to let the session run until removed from lyse.
max_num_runs = 400
max_num_runs_without_better_params = 80

# Set for a reproducible run; omit for a different sequence each time.
# seed = 12345

# Every learner knob goes in the table of the learner that takes it. A knob in
# [GENERAL] would reach the Gaussian process and its explorer alike; here each
# gets its own, which is why trust_region is written twice below with two
# values.
[LEARNER.directed_random]
# How far from the centre point a draw may land, as a fraction of each
# parameter's range. The explorer's job is to spread points out, so this is the
# wider of the two.
trust_region = 0.2


# The band of costs, as a fraction of the way from the worst seen towards the
# best, that a search may be centred on. The default sits away from the best
# point on purpose: centring on middling results is what makes this learner
# explore rather than refine.
trust_range = [0.1, 0.25]
# A share of proposals that ignore the trust region entirely.
explore_fraction = 0.0

[LEARNER.gaussian_process]
# The learner that runs the warmup and the explorer shots behind each batch:
# random or directed_random, on the knobs of its own table above.
# differential_evolution cannot explore, because it proposes a whole
# population at a time, and neither can gaussian_process itself.
explorer = "directed_random"

# How many usable observations the explorer gathers before the Gaussian
# process proposes, counting observations a fit can use rather than shots: a
# NaN cost does not count. Defaults to twice the number of searched
# parameters, and never fewer than five. Warmup ends at the count, and the
# explorer shots already queued then still run.
warmup_observations = 20

# How many points the Gaussian process proposes at a time, each conditioned on
# the ones before it. The kernel's hyperparameters are refit once per batch,
# which is the expensive part, and the next batch goes out when every point of
# this one has come back or been given up on.
batch_size = 4

# How many explorer shots follow each batch at the least. num_buffered_runs
# above raises it and never lowers it: the number queued is the larger of the
# two. Zero here, beside num_buffered_runs = 0, is a Gaussian process with no
# explorer shots after warmup, which idles the apparatus during each fit.
explore_runs = 1

# The same knob as the explorer's, with its own value: the search refines
# around the best point rather than spreading out.
trust_region = 0.05

# Whether the cost column carries noise, which the kernel is fitted with.
cost_has_noise = true

# Bounds on the kernel's length scale, in units of the unit cube every
# parameter is scaled onto. A fit that leaves a length scale at the upper end
# sees no structure along that parameter; at the lower end, structure finer
# than the shots are spaced. Either is worth knowing, so it is said in lyse's
# output -- once when the set of such parameters appears, and once more when
# it changes or clears, rather than on every refit.
# length_scale_bounds = [1e-2, 1e2]

# The exploration schedule: the weight on predicted uncertainty, one entry per
# point of a batch, walked from the first at every batch. A zero is a purely
# greedy point and the rest look progressively further from what is already
# known, so with the default list and a batch of four, every batch opens
# greedily and spends one point at each weight. Raise the weights to explore
# harder. A single number rather than a list is a cycle of one step, and so a
# fixed weight on every point.
uncer_bias = [0.0, 1.0, 2.0, 3.0]

# One optimised parameter per table. "global_name" is shorthand for a
# runmanager global that takes this parameter's value directly.
[PARAMETERS.CMOT.CMOTCaptureWidth]
global_name = "CMOTCaptureWidth"
min = 0.01
max = 0.5
start = 0.05

[PARAMETERS.CMOT.CMOTCurrent]
global_name = "CMOTCurrent"
min = 5
max = 40
start = 20

# enable = false keeps a parameter in the file but out of the search, leaving
# its runmanager global at whatever value it already holds.
[PARAMETERS.CMOT.CMOTFreq]
global_name = "CMOTFreq"
enable = false
min = -1
max = 1.5
start = 0.5

# When several parameters feed one global, give the global an expression
# instead. "args" names the parameters, in the order the lambda takes them.
# [PARAMETERS.CMOT.bx]
# min = -1.0
# max = 1.0
#
# [PARAMETERS.CMOT.by]
# min = -1.0
# max = 1.0
#
# [RUNMANAGER_GLOBALS.CMOT.ShimVector]
# expr = "lambda a, b: (a, b)"
# args = ["bx", "by"]
