# Configuration for a labscript-optimization session.
#
# Every key must be one this package knows, and a spelling it does not stops
# the load with a message naming it, rather than being accepted and ignored: a
# setting nothing reads is one a lab believes is in force when it is not.
#
# [GENERAL] carries the session's own settings; a learner's knobs go in
# [LEARNER.<name>], the table of the learner that takes them, and a knob
# written in [GENERAL] is refused with the table it belongs in named. A table
# written for a learner this file does not build goes unread, so the settings
# for several learners can sit here and be switched between.

[ANALYSIS]
# Which (routine, result) column of the lyse dataframe holds the cost. The
# routine that writes it is one of your own; this package never computes a
# cost. An optional "u_<result>" column alongside it is read as the
# uncertainty and weights the Gaussian process fit. A shot whose cost is NaN
# is recorded as a bad observation: it counts as a completed run and is left
# out of the fits, rather than being waited on for a cost that has already
# been and gone.
cost_key = ["zTOF_singleShot", "Nb"]

# The cost column holds something to be made as large as possible.
maximize = true

# Only parameter groups named here take part.
groups = ["CMOT"]

[GENERAL]
# random, directed_random, differential_evolution or gaussian_process.
# gaussian_process is the one that trains first; "trainer" below says which
# learner does the training.
learner = "gaussian_process"

# How many shots to keep in runmanager's queue at once. More than one is
# usually what you want. BLACS asks for a shot as soon as it finishes the last, which is before
# this optimiser has seen the cost and proposed a replacement, so a queue
# holding only one of our shots is empty at exactly that moment and runmanager
# gives BLACS a default shot instead. At one buffered run roughly every second
# shot is a default one. Raise it if the "starved" count the routine returns
# keeps climbing: the fit is taking longer than a shot.
#
# Not accepted with differential_evolution, which proposes one whole population
# at a time and waits for all of it: its queue depth is population_size.
num_buffered_runs = 3

# How many shots the trainer runs before the Gaussian process takes over. At
# least the Gaussian process's own minimum_observations, which defaults to
# twice the number of searched parameters: a smaller number here would not be
# where the handover happened, and is refused rather than quietly meaning the
# larger one.
num_training_runs = 20

# Stop conditions. Omit either to let the session run until removed from lyse.
max_num_runs = 400
max_num_runs_without_better_params = 80

# Set for a reproducible run; omit for a different sequence each time.
# seed = 12345

# A learner that needs training runs this one for its training shots. random,
# directed_random or
# gaussian_process; differential_evolution cannot train, because it proposes a
# whole population at a time. Only for a learner that trains: naming one
# beside a learner that does not is refused.
trainer = "directed_random"

# Every learner knob goes in the table of the learner that takes it. A knob in
# [GENERAL] would reach the learner and its trainer alike; here each gets its
# own, which is why trust_region is written twice below with two values.
[LEARNER.directed_random]
# How far from the centre point a draw may land, as a fraction of each
# parameter's range. The trainer's job is to spread points out, so this is the
# wider of the two.
trust_region = 0.2


# The band of costs, as a fraction of the way from the worst seen towards the
# best, that a search may be centred on. The default sits away from the best
# point on purpose: centring on middling results is what makes this learner
# explore rather than refine.
trust_range = [0.1, 0.25]
# A share of proposals that ignore the trust region entirely.
explore_fraction = 0.0

[LEARNER.gaussian_process]
# The same knob as the trainer's, with its own value: once training is over,
# the search refines around the best point rather than spreading out.
trust_region = 0.05

# Whether the cost column carries noise, which the kernel is fitted with.
cost_has_noise = true

# Bounds on the kernel's length scale, in units of the unit cube every
# parameter is scaled onto. A fit that leaves a length scale at the upper end
# sees no structure along that parameter; at the lower end, structure finer
# than the shots are spaced. Either is worth knowing, so it is said in lyse's
# output -- once when the set of such parameters appears, and once more when
# it changes or clears, rather than on every refit.
# length_scale_bounds = [1e-2, 1e2]

# The exploration schedule: the weight on predicted uncertainty, one entry per
# proposal, cycled by the number of observations in hand. A zero is a purely
# greedy proposal and the rest look progressively further from what is already
# known, so the list's length is how often the search comes back round to the
# greedy one. Raise the weights to explore harder. A single number rather than
# a list is a cycle of one step, and so a fixed weight on every proposal.
uncer_bias = [0.0, 1.0, 2.0, 3.0]

# How many new observations arrive between one refit of the kernel's
# hyperparameters and the next. That fit is the expensive part; the posterior
# is refit to all the data on every proposal regardless.
refit_interval = 4

# One optimised parameter per table. "global_name" is shorthand for a
# runmanager global that takes this parameter's value directly.
[PARAMETERS.CMOT.CMOTCaptureWidth]
global_name = "CMOTCaptureWidth"
min = 0.01
max = 0.5
start = 0.05

[PARAMETERS.CMOT.CMOTCurrent]
global_name = "CMOTCurrent"
min = 5
max = 40
start = 20

# enable = false keeps a parameter in the file but out of the search, leaving
# its runmanager global at whatever value it already holds.
[PARAMETERS.CMOT.CMOTFreq]
global_name = "CMOTFreq"
enable = false
min = -1
max = 1.5
start = 0.5

# When several parameters feed one global, give the global an expression
# instead. "args" names the parameters, in the order the lambda takes them.
# [PARAMETERS.CMOT.bx]
# min = -1.0
# max = 1.0
#
# [PARAMETERS.CMOT.by]
# min = -1.0
# max = 1.0
#
# [RUNMANAGER_GLOBALS.CMOT.ShimVector]
# expr = "lambda a, b: (a, b)"
# args = ["bx", "by"]
